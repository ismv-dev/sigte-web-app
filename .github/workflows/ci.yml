name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  security-gate:
    name: DevSecOps Quality Gate (SAST / SCA / Secret Scanning)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/sigte_ci"
      JWT_SECRET: "ci-only-fake-secret-not-used-in-production-32chars"
      QR_SECRET: "ci-only-fake-qr-secret-not-used-in-production-32c"
      PLATE_ENCRYPTION_KEY: "ci-only-fake-plate-key-32-chars-long-safe!"
      BLIND_INDEX_SALT: "ci-only-blind-index-salt-institutional-2026"
      AUDIT_SECRET_KEY: "ci-only-k-audit-secret-key-segregated-inmutable"
      LPR_API_KEY: "ci-only-lpr-gateway-api-key-secure-access-token"
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm exec prisma generate

      - name: Escaneo de Secretos Expuestos (Secret Scanning - RT-09)
        run: |
          echo "Verificando ausencia de secretos en el código fuente..."
          node scripts/security-audit.mjs --scan-secrets

      - name: Análisis de Composición de Software (SCA - RT-09 / RQ-09)
        run: |
          echo "Ejecutando auditoría de dependencias para vulnerabilidades conocidas (CVEs)..."
          pnpm audit --audit-level=high || echo "Advertencias de dependencias registradas para revisión"

      - name: Análisis Estático de Código (SAST - RT-09)
        run: |
          echo "Ejecutando linter y comprobación estática de tipos..."
          pnpm exec tsc --noEmit --incremental false
          pnpm lint

      - name: Suite de Pruebas Automatizadas de Ciberseguridad (RQ-01 a RQ-10)
        run: |
          echo "Ejecutando suite integral de ciberseguridad..."
          node scripts/security-audit.mjs --run-tests

      - name: Verificación de Integridad Forense (Tamper-Proof Chaining - RQ-04)
        run: |
          echo "Verificando protocolo de simulación anti-tampering..."
          node --import ./scripts/test-register.mjs --experimental-strip-types scripts/verify-tamper-proof.ts

      - name: Verificación de Compilación (Build Gate)
        run: pnpm build
