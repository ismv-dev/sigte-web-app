services:
  postgres:
    image: postgres:16-alpine
    container_name: sigte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sigtedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sigtedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: sigte-web:latest
    container_name: sigte-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/sigtedb?schema=public}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-super-seguro-de-al-menos-32-caracteres-12345}
      JWT_ISSUER: ${JWT_ISSUER:-sigte.local}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-sigte.app}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
      QR_SECRET: ${QR_SECRET:-dev-qr-secret-super-seguro-32-caracteres-2026}
      PLATE_ENCRYPTION_KEY: ${PLATE_ENCRYPTION_KEY:-dev-plate-aes-256-gcm-key-32-bytes-safe-2026}
      BLIND_INDEX_SALT: ${BLIND_INDEX_SALT:-dev-blind-index-salt-institutional-2026}
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:-dev-k-audit-secret-key-segregated-inmutable-2026}
      LPR_API_KEY: ${LPR_API_KEY:-dev-lpr-gateway-api-key-secure-access-token-2026}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
